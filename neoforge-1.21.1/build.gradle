plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev'
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':core').sourceSets.main)
        }
    }

    unitTest {
        testedMod = mods.getByName(mod_id)
        enable()
    }
}

// Include resources generated by data generators.
def gameTestNamespace = mod_id
def generateGameTestStructure = tasks.register('generateGameTestStructure') {
    def outputDirectory = layout.buildDirectory.dir('generated/gametestResources')
    outputs.dir(outputDirectory)

    doLast {
        def target = outputDirectory.get().file(
                "data/${gameTestNamespace}/structure/empty.nbt"
        ).asFile
        target.parentFile.mkdirs()
        def bytes = new ByteArrayOutputStream()
        def data = new DataOutputStream(new java.util.zip.GZIPOutputStream(bytes))

        data.writeByte(10)
        data.writeUTF('')
        data.writeByte(3)
        data.writeUTF('DataVersion')
        data.writeInt(3955)

        data.writeByte(9)
        data.writeUTF('size')
        data.writeByte(3)
        data.writeInt(3)
        [3, 3, 3].each(data::writeInt)

        data.writeByte(9)
        data.writeUTF('palette')
        data.writeByte(10)
        data.writeInt(1)
        data.writeByte(8)
        data.writeUTF('Name')
        data.writeUTF('minecraft:air')
        data.writeByte(0)

        ['blocks', 'entities'].each { name ->
            data.writeByte(9)
            data.writeUTF(name)
            data.writeByte(10)
            data.writeInt(0)
        }
        data.writeByte(0)
        data.close()
        target.bytes = bytes.toByteArray()
    }
}

sourceSets.main.resources.srcDir generateGameTestStructure


dependencies {
    // Core is compiled into this mod's JAR below. Keep it off published runtime
    // metadata so players never need a second core artifact.
    compileOnly project(':core')
    testImplementation project(':core')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.14.2'

    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.named('test') {
    useJUnitPlatform()
}

def forbiddenCommonClientReference = ~/\bnet\.minecraft\.client(?:\.|;)/
def dedicatedServerSafeSources = sourceSets.main.allJava.matching {
    exclude 'org/waterflane/villager_potential/client/**'
    exclude 'org/waterflane/villager_potential/mixin/client/**'
}

tasks.register('checkDedicatedServerImports') {
    group = 'verification'
    description = 'Rejects client-only Minecraft references outside the isolated client package.'
    inputs.files(dedicatedServerSafeSources)

    doLast {
        def violations = dedicatedServerSafeSources.files.collectMany { sourceFile ->
            sourceFile.readLines().withIndex().findResults { line, index ->
                line =~ forbiddenCommonClientReference
                        ? "${sourceFile}:${index + 1}: ${line.trim()}"
                        : null
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Client-only references are forbidden outside the client package:\n"
                            + violations.join('\n')
            )
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('checkDedicatedServerImports')
}

tasks.named('jar', Jar) {
    from project(':core').sourceSets.main.output
    // GameTests remain available to development runs but are not release assets.
    exclude 'org/waterflane/villager_potential/VillagerProgressionGameTests*.class'
    exclude "data/${gameTestNamespace}/structure/empty.nbt"

    manifest {
        attributes(
                'Implementation-Title': mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_authors
        )
    }
}

def releaseJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def requiredReleaseEntries = [
        'META-INF/MANIFEST.MF',
        'META-INF/neoforge.mods.toml',
        'villager_potential.mixins.json',
        'assets/villager_potential/lang/en_us.json',
        'assets/villager_potential/lang/ru_ru.json',
        'org/waterflane/villager_potential/Villager_potential.class',
        'org/waterflane/villager_potential/ServerConfig.class',
        'org/waterflane/villager_potential/SpecializationDefinitionManager.class',
        'org/waterflane/villager_potential/VanillaTradeClassifications.class',
        'org/waterflane/villager_potential/VillagerPotentialFeedback.class',
        'org/waterflane/villager_potential/core/VillagerPotential.class',
        'org/waterflane/villager_potential/core/VillagerPotentialState.class',
        'org/waterflane/villager_potential/core/SpecializationDefinitionParser.class'
]
def expectedMetadata = [
        "modId = \"${mod_id}\"",
        "version = \"${mod_version}\"",
        "displayName = \"${mod_name}\"",
        "license = \"${mod_license}\"",
        "authors = \"${mod_authors}\"",
        "versionRange = \"${neo_version_range}\"",
        "versionRange = \"${minecraft_version_range}\"",
        "javaVersion = \"${java_version_range}\""
]
def expectedManifestVersion = mod_version

tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Verifies the self-contained NeoForge release artifact.'
    dependsOn tasks.named('jar')
    inputs.file(releaseJar)

    doLast {
        def archive = releaseJar.get().asFile
        def zip = new java.util.zip.ZipFile(archive)
        try {
            def names = zip.entries().collect { it.name }
            def duplicates = names.countBy { it }.findAll { name, count -> count > 1 }.keySet()
            if (!duplicates.isEmpty()) {
                throw new GradleException("Duplicate release JAR entries: ${duplicates.sort()}")
            }

            def missing = requiredReleaseEntries.findAll { !names.contains(it) }
            if (!missing.isEmpty()) {
                throw new GradleException("Missing required release JAR entries: ${missing}")
            }

            def developmentEntries = names.findAll { name ->
                name.contains('/src/test/')
                        || name.contains('/test/')
                        || name.contains('VillagerProgressionGameTests')
                        || name.endsWith('/structure/empty.nbt')
            }
            if (!developmentEntries.isEmpty()) {
                throw new GradleException("Development-only entries in release JAR: ${developmentEntries}")
            }

            def metadataEntry = zip.getEntry('META-INF/neoforge.mods.toml')
            def metadata = zip.getInputStream(metadataEntry).getText('UTF-8')
            def missingMetadata = expectedMetadata.findAll { !metadata.contains(it) }
            if (!missingMetadata.isEmpty()) {
                throw new GradleException("Release metadata is incomplete: ${missingMetadata}")
            }
            if (metadata.contains('1.20.1')
                    || metadata.contains('net.minecraftforge')
                    || metadata.contains('currently 47')
                    || metadata.contains('.invalid')) {
                throw new GradleException('Forge 1.20.1 placeholder found in release metadata.')
            }

            def manifest = zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')).getText('UTF-8')
            if (!manifest.contains("Implementation-Version: ${expectedManifestVersion}")) {
                throw new GradleException('Manifest version does not match mod_version.')
            }

            def json = new groovy.json.JsonSlurper()
            def english = json.parse(zip.getInputStream(zip.getEntry(
                    'assets/villager_potential/lang/en_us.json'
            ))) as Map
            def russian = json.parse(zip.getInputStream(zip.getEntry(
                    'assets/villager_potential/lang/ru_ru.json'
            ))) as Map
            if (english.keySet() != russian.keySet()) {
                throw new GradleException('en_us and ru_ru localization keys do not match.')
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('release', Sync) {
    group = 'build'
    description = 'Creates the single distributable NeoForge mod artifact.'
    dependsOn tasks.named('verifyReleaseJar')
    from releaseJar
    into rootProject.layout.buildDirectory.dir('release')
}

tasks.named('check') {
    dependsOn tasks.named('verifyReleaseJar')
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             java_version_range     : java_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
